from: markdown+yaml_metadata_block+raw_tex
to: latex
standalone: true

# Name of the intermediate .tex file is controlled externally
# (Makefile passes -o build/basic-book-builder.tex)

include-in-header:
  - conf/header.tex

include-before-body:
  - conf/frontmatter.tex

filters:
  - filters/callouts.lua

metadata:
  # PDF engine used during XeLaTeX compilation
  pdf-engine: xelatex
  bookmarks: false

variables:
  documentclass: book
  classoption:
    - openany
  fontsize: 12pt
  geometry:
    - margin=1in

  toc: true
  toc-depth: 3
  toc-title: "Contents"

  numbersections: true

  # used by your header template
  graphics: true
  colorlinks: true
  linkcolor: blue
  float: false
  figure-latex-placement: H

resource-path:
  - .
  - lib/img
  - lib/diag

citeproc: true
